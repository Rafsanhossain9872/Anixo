name = "anixo-worker"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
routes = [{ pattern = "tenzora.top/*", zone_name = "tenzora.top" }]

[vars]
CF_WORKER = "true"

[triggers]
crons = ["*/10 * * * *", "*/15 * * * *", "*/30 * * * *", "0 0 * * *"]
