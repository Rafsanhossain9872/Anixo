name = "anixo-worker"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
CF_WORKER = "true"

# NOTE: KV namespace binding is configured via Cloudflare Dashboard
# (Worker Settings > Bindings > KV Namespace > SEO_KV)
# This keeps CI deploys working without needing KV permissions in the API token.
# The worker code gracefully falls back to edge cache when KV is unavailable.

[triggers]
crons = ["*/10 * * * *", "*/15 * * * *", "*/30 * * * *", "0 0 * * *"]